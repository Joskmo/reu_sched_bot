[project]
name = "reu-sched-bot"
version = "0.1.0"
description = "Schedule bot for REU university"
readme = "README.md"
authors = [
    { name = "Arseny", email = "zinkin.ar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "aiogram==3.13.1",
    "aiohappyeyeballs==2.4.3",
    "aiohttp==3.10.9",
    "aiosignal==1.3.1",
    "annotated-types==0.7.0",
    "apscheduler==3.10.4",
    "attrs==24.2.0",
    "beautifulsoup4==4.12.3",
    "bs4==0.0.2",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "frozenlist==1.4.1",
    "idna==3.10",
    "magic-filter==1.0.12",
    "multidict==6.1.0",
    "pydantic==2.9.2",
    "pydantic-core==2.23.4",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "pytz==2024.2",
    "redis==6.4.0",
    "six==1.16.0",
    "soupsieve==2.6",
    "typing-extensions==4.12.2",
    "tzlocal==5.2",
    "urllib3==2.2.3",
    "yarl==1.13.1",
]

[project.scripts]
bot = "reu_sched_bot.main:run"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"
