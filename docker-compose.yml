services:
  bot:
    build:
      context: ./bot
    command: python -m bot.bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$REDIS_PASSWORD";
        else
          exec redis-server;
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./.env:/run/secrets/.env:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$REDIS_PASSWORD" ]; then
            redis-cli -a "$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

volumes:
  redis_data:
